<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML5 Multimedia Exercise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="container">
        <h1>Multimedia Player</h1>

        <div class="media-group">
            <h2>Video Player</h2>
            <video id="myVideo" width="480" controls>
                <source src="video.mp4" type="video/mp4">
            </video>
            <p>Current Time: <span id="videoTime">0:00</span></p>
        </div>

        <hr>

        <div class="media-group">
            <h2>Audio Player</h2>
            <audio id="myAudio" controls>
                <source src="audio.mp3" type="audio/mpeg">
            </audio>
            <p>Current Time: <span id="audioTime">0:00</span></p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
