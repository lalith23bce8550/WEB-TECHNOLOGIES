<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Notes Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Notes Manager</h1>
        </header>

        <!-- Add/Edit Note Form -->
        <div class="form-container">
            <h2 id="formTitle">Add New Note</h2>
            <form id="noteForm">
                <input type="hidden" id="noteId"> <!-- Hidden field for Update ID -->
                
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="e.g., MongoDB Basics" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="e.g., Database" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="4" placeholder="Enter note details..." required></textarea>
                </div>

                <button type="submit" id="submitBtn">Add Note</button>
                <button type="button" id="cancelBtn" style="display:none;">Cancel</button>
            </form>
        </div>

        <!-- View Notes Section -->
        <div class="notes-container">
            <h2>My Notes</h2>
            <div id="notesList">
                <!-- Notes will be dynamically inserted here -->
                <p>Loading notes...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
