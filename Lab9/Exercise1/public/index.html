<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercise 1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        padding: 40px;
        max-width: 500px;
        width: 100%;
      }
      .card h1 {
        color: #667eea;
        font-size: 32px;
        margin-bottom: 24px;
        border-bottom: 3px solid #764ba2;
        padding-bottom: 12px;
      }
      .card p {
        color: #333;
        font-size: 18px;
        margin: 16px 0;
        line-height: 1.6;
      }
      .card strong {
        color: #667eea;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
